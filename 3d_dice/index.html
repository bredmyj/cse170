<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snap Dice - 3D Dice Roller (Three.js)</title>
<style>
  :root { --bg:#14161c; --panel:#1f232d; --text:#eceef3; --accent:#ff6b35; --muted:#8b93a5; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; overflow:hidden; }
  canvas { display:block; }
  .panel { position:fixed; background:var(--panel); border-radius:12px; padding:12px; box-shadow:0 4px 18px #0006; }
  .hidden { display:none; }
  #controls { bottom:12px; left:12px; display:flex; flex-direction:column; gap:10px; max-width:calc(100vw - 24px); }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  label { color:var(--muted); font-size:12px; width:100%; }
  button { background:#2d3342; color:var(--text); border:0; border-radius:8px; padding:8px 12px; font-size:15px; cursor:pointer; }
  button.on { background:var(--accent); }
  button:active { transform:scale(.96); }
  #roll { background:var(--accent); font-weight:700; font-size:18px; padding:12px; width:100%; }
  #count { font-size:20px; font-weight:700; min-width:28px; text-align:center; }
  #result { top:12px; right:12px; text-align:right; min-width:120px; }
  #total { font-size:44px; font-weight:800; color:var(--accent); line-height:1; }
  #each { color:var(--muted); font-size:14px; margin-top:4px; max-width:240px; }
  #history { bottom:12px; right:12px; width:260px; max-height:32vh; overflow:auto; font-size:13px; }
  #history h4 { margin:0 0 6px; color:var(--muted); font-weight:600; }
  #history #hlist > div { padding:4px 0; border-top:1px solid #ffffff14; }
  #history #hlist > div:first-child { border-top:0; }
  #history b { color:var(--accent); }
  #history .empty { color:var(--muted); }
  #title { position:fixed; top:10px; left:50%; transform:translateX(-50%); margin:0;
  font-size:40px; font-weight:900; letter-spacing:6px; text-transform:uppercase;
  color:var(--accent); text-shadow:0 3px 0 #000, 0 0 18px #ff6b3588; pointer-events:none; }
  #coins { top:12px; left:12px; display:flex; align-items:center; gap:10px; padding:10px 14px; font-size:22px; font-weight:800; }
  .coin { width:26px; height:26px; border-radius:50%; flex:none; border:2px solid #b8860b;
    background:radial-gradient(circle at 35% 35%, #fff6b0, #ffd700 50%, #b8860b); box-shadow:0 0 8px #ffd70088; }
  #coinCount { min-width:28px; }
  #shopBtn { padding:6px 10px; font-size:13px; }
  #shop { top:80px; left:12px; width:260px; max-height:60vh; overflow:auto; }
  #shop h4 { margin:0 0 6px; color:var(--muted); font-weight:600; font-size:13px; }
  .item { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; border-top:1px solid #ffffff14; font-size:14px; }
  .item:first-child { border-top:0; }
  .item small { display:block; color:var(--muted); font-size:12px; }
  .item button { padding:6px 10px; font-size:13px; }
  .item button:disabled { opacity:.4; cursor:default; }
  @media (max-width:600px){ #history { width:calc(100vw - 24px); left:12px; max-height:20vh; } #each{max-width:160px;} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
</head>
<body>
<h1 id="title">Snap Dice</h1>
<div id="coins" class="panel"><span class="coin"></span><span id="coinCount">0</span><button id="shopBtn">SHOP</button></div>
<div id="shop" class="panel hidden"><h4>Effects &amp; skins</h4><div id="shopList"></div></div>
<div id="controls" class="panel">
  <div class="row"><label>Dice type</label><span id="types"></span></div>
  <div class="row"><label>Number of dice</label>
    <button id="minus">−</button><span id="count">2</span><button id="plus">+</button></div>
  <button id="roll">ROLL (space)</button>
</div>
<div id="result" class="panel"><div id="total">–</div><div id="each">Press roll</div></div>
<div id="history" class="panel"><h4>History</h4><div id="hlist"><div class="empty">No rolls yet</div></div></div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ---------- tuning ----------
const GRAVITY = -140;      // heavy gravity = quick falls
const TIME_SCALE = 1.6;    // simulation runs faster than real time
const DAMPING = 0.08;      // low air drag so throws feel punchy
const TABLE_X = 9, TABLE_Z = 5.5;
const CLICK_DELAY = 300;   // ms to wait after a click, so a double-click can cancel the roll
const MAX_HISTORY = 50;

// ---------- renderer, scene, camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161c);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);

scene.add(new THREE.HemisphereLight(0xffffff, 0x445066, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(5, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 });
scene.add(sun);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(TABLE_X * 2, TABLE_Z * 2),
  new THREE.MeshStandardMaterial({ color: 0x1d6b4a, roughness: 0.95 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const rim = new THREE.LineSegments(
  new THREE.EdgesGeometry(floor.geometry),
  new THREE.LineBasicMaterial({ color: 0x8b5a2b })
);
rim.rotation.x = -Math.PI / 2;
rim.position.y = 0.01;
scene.add(rim);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.position.set(0, 17, 10).multiplyScalar(Math.max(1, 1.5 / camera.aspect));
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ---------- physics ----------
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, GRAVITY, 0) });
world.allowSleep = false;
const diceMat = new CANNON.Material('dice');
const wallMat = new CANNON.Material('wall');
world.addContactMaterial(new CANNON.ContactMaterial(diceMat, wallMat, { friction: 0.25, restitution: 0.35 }));
world.addContactMaterial(new CANNON.ContactMaterial(diceMat, diceMat, { friction: 0.2, restitution: 0.4 }));

function addWall(pos, rotAxis, angle) {
  const b = new CANNON.Body({ mass: 0, material: wallMat, shape: new CANNON.Plane() });
  b.position.set(...pos);
  if (rotAxis) b.quaternion.setFromAxisAngle(new CANNON.Vec3(...rotAxis), angle);
  world.addBody(b);
}
addWall([0, 0, 0], [1, 0, 0], -Math.PI / 2);       // floor
addWall([0, 0, -TABLE_Z], null, 0);                 // back
addWall([0, 0, TABLE_Z], [0, 1, 0], Math.PI);       // front
addWall([-TABLE_X, 0, 0], [0, 1, 0], Math.PI / 2);  // left
addWall([TABLE_X, 0, 0], [0, 1, 0], -Math.PI / 2);  // right
addWall([0, 14, 0], [1, 0, 0], Math.PI / 2);        // ceiling

// ---------- dice shapes ----------
// d10 and d100 are built separately (see buildD10 and buildSphereDie)
const TYPES = {
  4:  () => new THREE.TetrahedronGeometry(1.3),
  6:  () => new THREE.BoxGeometry(1.5, 1.5, 1.5),
  8:  () => new THREE.OctahedronGeometry(1.2),
  12: () => new THREE.DodecahedronGeometry(1.2),
  20: () => new THREE.IcosahedronGeometry(1.3),
};
const BUTTON_SIDES = [4, 6, 8, 10, 12, 20, 100];

// ---------- number labels ----------
const labelCache = {};
function labelTexture(n) {
  if (labelCache[n]) return labelCache[n];
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.font = (n >= 100 ? 'bold 56px' : 'bold 84px') + ' system-ui';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(String(n), 64, 64);
  if (n === 6 || n === 9) g.fillRect(40, 108, 48, 8);
  return (labelCache[n] = new THREE.CanvasTexture(c));
}

// Label materials are shared between dice, so they are created once per number
const labelMats = {};
function labelMaterial(n) {
  if (!labelMats[n]) {
    labelMats[n] = new THREE.MeshBasicMaterial({
      map: labelTexture(n), transparent: true, color: 0x111111,
      polygonOffset: true, polygonOffsetFactor: -2
    });
  }
  return labelMats[n];
}

// A flat number plate at `pos`, facing `normal`, lifted `lift` units off the surface
function makeLabel(n, size, pos, normal, lift) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), labelMaterial(n));
  m.position.copy(pos).addScaledVector(normal, lift);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
  return m;
}

// ---------- building dice ----------
// Each die returns: mesh (visual), body (physics), faceInfo (face normals + values for reading the result)
function makeMat(color, flat = true, gold = false) {
  if (gold) {
    return new THREE.MeshStandardMaterial({
      color: 0xffd700, roughness: 0.2, metalness: 0.9, emissive: 0x3a2a00, flatShading: flat
    });
  }
  return new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.1, flatShading: flat });
}

function buildDie(sides, color) {
  if (sides === 100) return buildSphereDie(makeMat(color));
  if (sides === 10) return buildD10(makeMat(color, false));            // smooth shading softens the tips
  return buildPolyDie(sides, makeMat(color, true, sides === 20 && goldOn));
}

function buildPolyDie(sides, mat) {
  let geo = TYPES[sides]();
  if (geo.index) geo = geo.toNonIndexed();
  const pos = geo.attributes.position;

  // Group triangles by face normal, so each polygon face becomes one die face
  const groups = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  for (let i = 0; i < pos.count; i += 3) {
    a.fromBufferAttribute(pos, i);
    b.fromBufferAttribute(pos, i + 1);
    c.fromBufferAttribute(pos, i + 2);
    const n = new THREE.Vector3().subVectors(c, b).cross(new THREE.Vector3().subVectors(a, b)).normalize();
    let face = groups.find(f => f.normal.distanceTo(n) < 0.01);
    if (!face) { face = { normal: n, pts: [] }; groups.push(face); }
    face.pts.push(a.clone(), b.clone(), c.clone());
  }

  const verts = [], faces = [], faceInfo = [];
  const findVert = p => {
    let i = verts.findIndex(v => v.distanceToSquared(p) < 1e-6);
    if (i < 0) { verts.push(p.clone()); i = verts.length - 1; }
    return i;
  };

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;

  let value = 1;
  for (const { normal, pts } of groups) {
    const center = pts.reduce((s, p) => s.add(p), new THREE.Vector3()).divideScalar(pts.length);
    const uniq = [];
    pts.forEach(p => { if (!uniq.some(q => q.distanceToSquared(p) < 1e-6)) uniq.push(p); });

    // Sort the face's corners counter-clockwise around its normal (needed for physics)
    const u = uniq[0].clone().sub(center).normalize();
    const v = new THREE.Vector3().crossVectors(normal, u);
    const angleOf = p => { const d = p.clone().sub(center); return Math.atan2(d.dot(v), d.dot(u)); };
    uniq.sort((p, q) => angleOf(p) - angleOf(q));
    faces.push(uniq.map(findVert));

    if (sides !== 4) {   // d4 numbers go on the corners instead (below)
      const size = Math.min(...uniq.map(p => p.distanceTo(center))) * 1.15;
      mesh.add(makeLabel(value, size, center, normal, 0.005));
      faceInfo.push({ normal, value });
      value++;
    }
  }

  if (sides === 4) {
    // d4: a number on each corner. The corner pointing straight up is the result.
    verts.forEach((vert, i) => {
      const n = vert.clone().normalize();
      mesh.add(makeLabel(i + 1, 0.55, vert, n, 0.03));
      faceInfo.push({ normal: n, value: i + 1 });
    });
  }

  const body = new CANNON.Body({
    mass: 1, material: diceMat, linearDamping: DAMPING, angularDamping: DAMPING,
    shape: new CANNON.ConvexPolyhedron({
      vertices: verts.map(p => new CANNON.Vec3(p.x, p.y, p.z)),
      faces
    })
  });
  return { mesh, body, faceInfo, sides };
}

// d10: a pentagonal trapezohedron, built from math since Three.js has no 10-sided solid.
// It has 10 kite-shaped faces and 12 corners: a top pole, a bottom pole, and 10 ring corners.
function buildD10(mat) {
  const C = Math.cos(Math.PI / 5);
  const S = 0.625;                           // overall size
  const SQUISH = 0.75;                       // shrinks the height so the die is less long and pointy
  const ringR = 2 / (1 + C) * S;             // how far the ring corners sit from the middle
  const ringY = 2 * (1 - C) / (1 + C) * S * SQUISH;   // how high (U) or low (D) the ring corners sit
  const poleY = 2 * S * SQUISH;              // how high the top and bottom poles sit

  const verts = [
    new THREE.Vector3(0, poleY, 0),    // 0: top pole
    new THREE.Vector3(0, -poleY, 0),   // 1: bottom pole
  ];
  const U = [], D = [];                 // U corners sit high, D corners sit low
  for (let k = 0; k < 5; k++) {
    const a = (36 + 72 * k) * Math.PI / 180;
    U.push(verts.length);
    verts.push(new THREE.Vector3(ringR * Math.cos(a), ringY, ringR * Math.sin(a)));
  }
  for (let k = 0; k < 5; k++) {
    const a = (72 * k) * Math.PI / 180;
    D.push(verts.length);
    verts.push(new THREE.Vector3(ringR * Math.cos(a), -ringY, ringR * Math.sin(a)));
  }

  // The 10 kites, each listed as 4 corner numbers in order around the kite.
  // Opposite kites always add up to 11.
  const kites = [];
  for (let k = 0; k < 5; k++) kites.push({ corners: [0, U[(k + 4) % 5], D[k], U[k]], value: k + 1 });
  for (let j = 0; j < 5; j++) kites.push({ corners: [1, D[j], U[j], D[(j + 1) % 5]], value: 10 - ((j + 3) % 5) });

  const faces = [], faceInfo = [], index = [];
  for (const kite of kites) {
    let corners = kite.corners;
    const P = corners.map(i => verts[i]);
    const center = new THREE.Vector3().add(P[0]).add(P[1]).add(P[2]).add(P[3]).divideScalar(4);
    const normal = new THREE.Vector3().subVectors(P[1], P[0]).cross(new THREE.Vector3().subVectors(P[2], P[0])).normalize();
    if (normal.dot(center) < 0) {       // make sure the normal points outward
      corners = [corners[0], corners[3], corners[2], corners[1]];
      normal.negate();
    }
    faces.push(corners);
    // Two triangles make up each kite, in the same winding order as the kite
    index.push(corners[0], corners[1], corners[2], corners[0], corners[2], corners[3]);
    faceInfo.push({ normal, value: kite.value, center });
  }

  // Shared vertices + computeVertexNormals makes the shading smooth, so the tips look rounder.
  // The physics shape below still uses the sharp corners, so landings stay fair.
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts.flatMap(v => [v.x, v.y, v.z]), 3));
  geo.setIndex(index);
  geo.computeVertexNormals();

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  for (const f of faceInfo) mesh.add(makeLabel(f.value, 0.5, f.center, f.normal, 0.005));

  const body = new CANNON.Body({
    mass: 1, material: diceMat, linearDamping: DAMPING, angularDamping: DAMPING,
    shape: new CANNON.ConvexPolyhedron({
      vertices: verts.map(v => new CANNON.Vec3(v.x, v.y, v.z)),
      faces
    })
  });
  return { mesh, body, faceInfo, sides: 10 };
}

// d100: a sphere with 100 numbered spots spread evenly over it (Fibonacci sphere)
function buildSphereDie(mat) {
  const R = 1.3, N = 100, GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(R, 48, 32), mat);
  mesh.castShadow = true;
  const faceInfo = [];
  for (let i = 0; i < N; i++) {
    const y = 1 - (i + 0.5) * 2 / N;
    const r = Math.sqrt(1 - y * y);
    const t = GOLDEN * i;
    const n = new THREE.Vector3(Math.cos(t) * r, y, Math.sin(t) * r);
    mesh.add(makeLabel(i + 1, 0.36, n.clone().multiplyScalar(R), n, 0.02));
    faceInfo.push({ normal: n, value: i + 1 });
  }
  const body = new CANNON.Body({
    mass: 1, material: diceMat, linearDamping: DAMPING, angularDamping: DAMPING,
    shape: new CANNON.Sphere(R)
  });
  return { mesh, body, faceInfo, sides: N };
}

// Which face is pointing up?
function readTop(die) {
  const q = die.mesh.quaternion, up = new THREE.Vector3(0, 1, 0);
  let best = -Infinity, val = 1;
  for (const f of die.faceInfo) {
    const d = f.normal.clone().applyQuaternion(q).dot(up);
    if (d > best) { best = d; val = f.value; }
  }
  return val;
}

// ---------- app state ----------
const COLORS = [0xe63946, 0x3a86ff, 0xffbe0b, 0x8338ec, 0xfb5607, 0x06d6a0, 0xff006e, 0x00b4d8];
let sides = 20, count = 2;
let dice = [];
let rolling = false, rollStart = 0, calmFor = 0;
const history = [];

const typesEl = document.getElementById('types');
const countEl = document.getElementById('count');
const totalEl = document.getElementById('total');
const eachEl = document.getElementById('each');
const hlistEl = document.getElementById('hlist');
const coinCountEl = document.getElementById('coinCount');
const shopEl = document.getElementById('shop');
const shopListEl = document.getElementById('shopList');

// Coins and shop
let coins = 0;
const SHOP_ITEMS = [
  { id: 'confetti', name: 'Confetti',   cost: 0,  kind: 'fx' },
  { id: 'flame',    name: 'Flame',      cost: 10, kind: 'fx' },
  { id: 'shimmer',  name: 'Shimmer',    cost: 10, kind: 'fx' },
  { id: 'fog',      name: 'Fog',        cost: 15, kind: 'fx' },
  { id: 'prism',    name: 'Prism',      cost: 15, kind: 'fx' },
  { id: 'golden',   name: 'Golden D20', cost: 50, kind: 'skin' },
];
const owned = new Set(['confetti']);
let equippedFx = 'confetti';   // one effect plays on max rolls
let goldOn = false;            // golden D20 skin on or off

function disposeDie(d) {
  scene.remove(d.mesh);
  world.removeBody(d.body);
  d.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  d.mesh.material.dispose();
}
function clearDice() { dice.forEach(disposeDie); dice = []; }

function roll() {
  clearDice();
  rolling = true;
  rollStart = performance.now();
  calmFor = 0;
  totalEl.textContent = '…';
  eachEl.textContent = 'Rolling';

  for (let i = 0; i < count; i++) {
    const d = buildDie(sides, COLORS[i % COLORS.length]);
    const x = -TABLE_X * 0.6 + TABLE_X * 1.2 * (count === 1 ? 0.5 : i / (count - 1)) + (Math.random() - 0.5);
    d.body.position.set(x, 3 + (i % 3) * 2.4, TABLE_Z - 1.5);
    d.body.quaternion.setFromEuler(Math.random() * 6, Math.random() * 6, Math.random() * 6);
    d.body.velocity.set((Math.random() - 0.5) * 14 - x * 0.6, -Math.random() * 4, -(26 + Math.random() * 16));
    d.body.angularVelocity.set(
      (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60
    );
    d.prevVel = d.body.velocity.clone();   // starts with the throw velocity
    world.addBody(d.body);
    scene.add(d.mesh);
    dice.push(d);
  }
}

function finish() {
  rolling = false;
  dice.forEach(d => { d.body.velocity.setZero(); d.body.angularVelocity.setZero(); });
  const vals = dice.map(readTop);
  const total = vals.reduce((s, v) => s + v, 0);
  const dieSides = dice[0].sides;

  // Each die that lands on its max value plays the equipped effect and earns a coin
  dice.forEach((d, i) => {
    if (vals[i] === d.sides) { burst(d.mesh.position, equippedFx); coins++; }
  });
  updateCoins();

  totalEl.textContent = total;
  eachEl.textContent = dice.length > 1 ? vals.join(' + ') : `d${dieSides}`;

  history.unshift({
    sides: dieSides, vals, total,
    t: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
  });
  history.length = Math.min(history.length, MAX_HISTORY);
  hlistEl.innerHTML = history.map(h =>
    `<div>${h.t} · ${h.vals.length}d${h.sides}: ${h.vals.join(', ')} = <b>${h.total}</b></div>`
  ).join('');
}

// ---------- effects (particles) ----------
const rand = ([lo, hi]) => lo + Math.random() * (hi - lo);

const FX_GEO = {
  plane:  new THREE.PlaneGeometry(0.14, 0.14),
  bit:    new THREE.PlaneGeometry(0.1, 0.1),
  strip:  new THREE.PlaneGeometry(0.07, 0.7),
  puff:   new THREE.SphereGeometry(0.45, 8, 6),
  ember:  new THREE.SphereGeometry(0.12, 6, 5),
};

// Each effect describes how its particles look and move
const FX = {
  confetti: { geo: 'plane', count: 140, colors: [0xff595e, 0xffca3a, 0x8ac926, 0x1982c4, 0x6a4c93, 0xff9f1c],
              hs: [3, 8], vy: [10, 20], g: 22, drag: 0.6, life: [2.5, 3.5], spin: 20 },
  flame:    { geo: 'ember', count: 110, colors: [0xff3b00, 0xff8c00, 0xffd000],
              hs: [0.5, 2], vy: [4, 9], g: -3, drag: 0.3, life: [0.7, 1.3], shrink: true, fade: 1, additive: true },
  shimmer:  { geo: 'bit', count: 90, colors: [0xffffff, 0xfff3b0, 0xa8e8ff],
              hs: [1, 3], vy: [3, 7], g: 4, drag: 0.8, life: [1.4, 2.2], twinkle: true, spin: 6 },
  fog:      { geo: 'puff', count: 30, colors: [0xdfe3ea, 0xbfc5cf],
              hs: [0.6, 1.6], vy: [0.2, 0.8], g: 0, drag: 0.5, life: [2.5, 3.5], grow: true, fade: 0.35 },
  prism:    { geo: 'strip', count: 70, rainbow: true,
              hs: [7, 13], vy: [0, 3], g: 2, drag: 1.2, life: [1.4, 2.0], spin: 10, fade: 1, additive: true },
};

const particles = [];
function burst(pos, key) {
  const cfg = FX[key];
  for (let i = 0; i < cfg.count; i++) {
    const color = cfg.rainbow ? new THREE.Color().setHSL(Math.random(), 1, 0.6) : cfg.colors[i % cfg.colors.length];
    const mat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: cfg.fade ?? 1, side: THREE.DoubleSide, depthWrite: false,
      blending: cfg.additive ? THREE.AdditiveBlending : THREE.NormalBlending
    });
    const m = new THREE.Mesh(FX_GEO[cfg.geo], mat);
    m.position.set(pos.x, pos.y + 0.6, pos.z);
    const a = Math.random() * Math.PI * 2, hs = rand(cfg.hs);
    scene.add(m);
    particles.push({
      m, mat, cfg,
      v: new THREE.Vector3(Math.cos(a) * hs, rand(cfg.vy), Math.sin(a) * hs),
      age: 0, life: rand(cfg.life),
      spin: (Math.random() - 0.5) * (cfg.spin || 0)
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i], cfg = p.cfg;
    p.age += dt;
    if (p.age >= p.life || p.m.position.y < -1) {
      scene.remove(p.m);
      p.mat.dispose();
      particles.splice(i, 1);
      continue;
    }
    const t = p.age / p.life;                       // 0 at birth, 1 at end
    p.v.y -= cfg.g * dt;
    p.v.multiplyScalar(1 - cfg.drag * dt);
    p.m.position.addScaledVector(p.v, dt);
    if (cfg.spin) { p.m.rotation.x += p.spin * dt; p.m.rotation.z += p.spin * dt * 0.7; }
    if (cfg.shrink) p.m.scale.setScalar(1 - 0.9 * t);
    if (cfg.grow) p.m.scale.setScalar(0.6 + 1.6 * t);
    if (cfg.twinkle) p.mat.opacity = (1 - t) * (0.5 + 0.5 * Math.sin(p.age * 14));
    else if (cfg.fade !== undefined) p.mat.opacity = cfg.fade * (1 - t);
  }
}

// ---------- shop ----------
function updateCoins() {
  coinCountEl.textContent = coins;
  renderShop();
}

function buy(item) {
  if (owned.has(item.id) || coins < item.cost) return;
  coins -= item.cost;
  owned.add(item.id);
  if (item.kind === 'fx') equippedFx = item.id;
  if (item.kind === 'skin') goldOn = true;
  updateCoins();
}

function renderShop() {
  shopListEl.innerHTML = '';
  for (const item of SHOP_ITEMS) {
    const row = document.createElement('div');
    row.className = 'item';

    const info = document.createElement('div');
    info.textContent = item.name;
    const sub = document.createElement('small');
    sub.textContent = item.cost ? `${item.cost} coins` : 'Free';
    info.appendChild(sub);

    const btn = document.createElement('button');
    if (!owned.has(item.id)) {
      btn.textContent = 'Buy';
      btn.disabled = coins < item.cost;
      btn.onclick = () => buy(item);
    } else if (item.kind === 'fx') {
      btn.textContent = equippedFx === item.id ? 'Equipped' : 'Equip';
      btn.disabled = equippedFx === item.id;
      btn.onclick = () => { equippedFx = item.id; renderShop(); };
    } else {
      btn.textContent = goldOn ? 'On' : 'Off';
      btn.onclick = () => { goldOn = !goldOn; renderShop(); };
    }

    row.append(info, btn);
    shopListEl.appendChild(row);
  }
}

// ---------- little red guy ----------
const GUY_RED = 0xe63946;
const STAND_Y = 1.85, LIE_Y = 0.6;   // body center height when standing / lying on his side
const WALK = 0.7, RUN = 4.0;
const HIT_DIST = 2.3;                // how close a die must be to knock him over
const HIT_SPEED = 2;                 // how fast a die must be rolling toward him to knock him over
const guyMat = new THREE.MeshStandardMaterial({ color: GUY_RED, roughness: 0.5 });
const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
let guy = null;

function makeGuyVisual() {
  const group = new THREE.Group();
  const part = (geo, x, y, z) => {
    const m = new THREE.Mesh(geo, guyMat);
    m.position.set(x, y, z);
    m.castShadow = true;
    group.add(m);
    return m;
  };
  // Limbs hang from a pivot (hip or shoulder) so they swing naturally
  const limb = (geo, x, y, len) => {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, 0);
    const m = new THREE.Mesh(geo, guyMat);
    m.position.y = -len / 2;
    m.castShadow = true;
    pivot.add(m);
    group.add(pivot);
    return pivot;
  };
  const legL = limb(new THREE.BoxGeometry(0.35, 1.05, 0.4), -0.25, -0.8, 1.05);
  const legR = limb(new THREE.BoxGeometry(0.35, 1.05, 0.4),  0.25, -0.8, 1.05);
  const armL = limb(new THREE.BoxGeometry(0.25, 0.9, 0.25), -0.7, 0.25, 0.9);
  const armR = limb(new THREE.BoxGeometry(0.25, 0.9, 0.25),  0.7, 0.25, 0.9);
  part(new THREE.BoxGeometry(0.9, 1, 0.5), 0, -0.3, 0);       // torso
  part(new THREE.SphereGeometry(0.8, 24, 16), 0, 1, 0);       // big head
  for (const x of [-0.3, 0.3]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 8), eyeMat);
    e.position.set(x, 1.1, 0.76);
    group.add(e);
  }
  return { group, legL, legR, armL, armR };
}

// Kinematic physics box: he pushes dice out of his way when he walks into them,
// and he tips over when a die rolls into him.
const _yawQ = new CANNON.Quaternion(), _rollQ = new CANNON.Quaternion();
const _Y = new CANNON.Vec3(0, 1, 0), _Z = new CANNON.Vec3(0, 0, 1);

function applyPose(g, k) {   // k = 0 standing, 1 lying on his side
  const p = g.body.position;
  p.y = STAND_Y + (LIE_Y - STAND_Y) * k;
  _yawQ.setFromAxisAngle(_Y, g.yaw);
  _rollQ.setFromAxisAngle(_Z, g.lieSide * k * Math.PI / 2);
  const q = _yawQ.mult(_rollQ);
  g.body.quaternion.set(q.x, q.y, q.z, q.w);
  g.vis.group.position.set(p.x, p.y, p.z);
  g.vis.group.quaternion.set(q.x, q.y, q.z, q.w);
}

function steer(g, vx, vz) {
  g.body.velocity.set(vx, 0, vz);
  if (Math.hypot(vx, vz) > 0.05) g.yaw = Math.atan2(vx, vz);
}

function pickTarget() {
  guy.target = {
    x: (Math.random() * 2 - 1) * (TABLE_X - 2.5),
    z: (Math.random() * 2 - 1) * (TABLE_Z - 2.5)
  };
}

function spawnGuy(x, z) {
  if (guy) { scene.remove(guy.vis.group); world.removeBody(guy.body); }
  const body = new CANNON.Body({
    mass: 0, type: CANNON.Body.KINEMATIC,
    shape: new CANNON.Box(new CANNON.Vec3(0.6, STAND_Y, 0.6))
  });
  body.position.set(x, STAND_Y, z);
  world.addBody(body);
  const vis = makeGuyVisual();
  scene.add(vis.group);
  guy = {
    vis, body, state: 'idle', t: 0, wait: 0.5,
    yaw: Math.random() * Math.PI * 2, lie: 0, lieSide: 1, phase: 0, target: null
  };
  applyPose(guy, 0);
}

function updateGuy(dt) {
  if (!guy) return;
  const g = guy, b = g.body, p = b.position;
  g.t += dt;
  g.phase += dt * (g.state === 'flee' ? 14 : 8);

  // Nearest die that is still moving is the one he runs from
  let threat = null, nearest = Infinity;
  for (const d of dice) {
    if (d.body.velocity.length() < 0.5) continue;
    const dist = Math.hypot(d.body.position.x - p.x, d.body.position.z - p.z);
    if (dist < nearest) { nearest = dist; threat = d.body.position; }
  }

  // Getting hit: only a die that was rolling toward him before this physics step can knock him over.
  // A die he walks into is not moving toward him, so walking into dice doesn't knock him down.
  if (g.state === 'walk' || g.state === 'idle' || g.state === 'flee') {
    const hitter = dice.find(d => {
      const dx = p.x - d.body.position.x, dz = p.z - d.body.position.z;   // die -> guy, horizontal
      const dist = Math.hypot(dx, dz);
      if (dist > HIT_DIST || d.body.position.y > 3.6) return false;
      const approach = (d.prevVel.x * dx + d.prevVel.z * dz) / dist;     // speed toward him
      return approach > HIT_SPEED;
    });
    if (hitter) {
      g.state = 'fall'; g.t = 0;
      // Fall away from the die. Aim his head along the push direction (die -> guy).
      const dx = p.x - hitter.body.position.x, dz = p.z - hitter.body.position.z;
      g.yaw = Math.atan2(dz, -dx);
      g.lieSide = 1;
      b.velocity.set(0, 0, 0);
    }
  }

  switch (g.state) {
    case 'walk': {
      const dx = g.target.x - p.x, dz = g.target.z - p.z, dist = Math.hypot(dx, dz);
      if (dist < 0.4) { g.state = 'idle'; g.t = 0; g.wait = 1 + Math.random() * 2; b.velocity.set(0, 0, 0); }
      else steer(g, dx / dist * WALK, dz / dist * WALK);
      break;
    }
    case 'idle':
      b.velocity.set(0, 0, 0);
      if (g.t > g.wait) { pickTarget(); g.state = 'walk'; g.t = 0; }
      break;
    case 'fall':
      g.lie = Math.min(g.t / 0.35, 1);
      if (g.lie >= 1) { g.state = 'down'; g.t = 0; }
      break;
    case 'down':
      if (g.t > 1.6) { g.state = 'rise'; g.t = 0; }
      break;
    case 'rise':
      g.lie = 1 - Math.min(g.t / 0.6, 1);
      if (g.lie <= 0) { g.state = 'flee'; g.t = 0; }
      break;
    case 'flee': {
      const scared = threat && nearest < 12;
      let fx, fz;
      if (scared) { fx = p.x - threat.x; fz = p.z - threat.z; }   // run straight away from the dice
      else { fx = Math.sin(g.yaw); fz = Math.cos(g.yaw); }
      if (Math.abs(p.x) > TABLE_X - 2) fx = -Math.sign(p.x);       // steer back off the edges
      if (Math.abs(p.z) > TABLE_Z - 2) fz = -Math.sign(p.z);
      const len = Math.hypot(fx, fz) || 1;
      steer(g, fx / len * RUN, fz / len * RUN);
      if (!scared && g.t > 3) { g.state = 'walk'; g.t = 0; pickTarget(); }
      break;
    }
  }

  // Limbs: easy swing when walking, fast swing when running, still otherwise
  const amp = g.state === 'walk' ? 0.5 : g.state === 'flee' ? 0.9 : 0;
  const s = Math.sin(g.phase) * amp;
  g.vis.legL.rotation.x = s;  g.vis.legR.rotation.x = -s;
  g.vis.armL.rotation.x = -s; g.vis.armR.rotation.x = s;

  applyPose(g, g.lie);
}

// ---------- main loop ----------
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05) * TIME_SCALE;
  // Save each die's velocity before physics runs, since a die loses its speed when it hits something
  for (const d of dice) d.prevVel = d.body.velocity.clone();
  world.step(1 / 120, dt, 8);
  for (const d of dice) {
    d.mesh.position.copy(d.body.position);
    d.mesh.quaternion.copy(d.body.quaternion);
  }
  updateGuy(dt);
  updateParticles(dt);
  if (rolling) {
    const still = dice.every(d => d.body.velocity.length() < 0.25 && d.body.angularVelocity.length() < 0.4);
    calmFor = still ? calmFor + dt : 0;
    const elapsed = performance.now() - rollStart;
    if ((calmFor > 0.25 && elapsed > 500) || elapsed > 4500) finish();
  }
  renderer.render(scene, camera);
}

// ---------- UI ----------
function refresh() {
  countEl.textContent = count;
  for (const btn of typesEl.children) btn.classList.toggle('on', +btn.dataset.s === sides);
}

for (const s of BUTTON_SIDES) {
  const btn = document.createElement('button');
  btn.textContent = 'd' + s;
  btn.dataset.s = s;
  btn.onclick = () => { sides = s; refresh(); roll(); };
  typesEl.appendChild(btn);
}

document.getElementById('minus').onclick = () => { count = Math.max(1, count - 1); refresh(); };
document.getElementById('plus').onclick = () => { count = Math.min(12, count + 1); refresh(); };
document.getElementById('roll').onclick = roll;

document.getElementById('shopBtn').onclick = () => {
  shopEl.classList.toggle('hidden');
  renderShop();
};

addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  if (e.repeat) return;
  document.activeElement?.blur();   // stop a focused button from also firing on space
  roll();
});

// Single click rolls after a short pause, so a double-click can cancel it and spawn the guy
let rollTimer = 0;
renderer.domElement.addEventListener('pointerdown', () => {
  clearTimeout(rollTimer);
  rollTimer = setTimeout(roll, CLICK_DELAY);
});

// Double-click the mat to drop the little red guy there
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
renderer.domElement.addEventListener('dblclick', e => {
  clearTimeout(rollTimer);
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObject(floor)[0];
  if (hit) {
    spawnGuy(
      Math.max(-TABLE_X + 1, Math.min(TABLE_X - 1, hit.point.x)),
      Math.max(-TABLE_Z + 1, Math.min(TABLE_Z - 1, hit.point.z))
    );
  }
});

// Start
refresh();
updateCoins();
roll();
frame();
</script>
